[package]
name = "shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri shell for the tray, settings window, and login autostart"

[lib]
name = "shell_lib"
path = "src/lib.rs"

[[bin]]
name = "background-customizer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
auto-launch = "0.6.0"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2.5.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
