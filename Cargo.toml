[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/renderer",
    "crates/decoder",
    "crates/shell",
    "crates/importer",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Renderer release settings. Cargo rejects `panic` on a package profile, so
# the strategy lives on the release profile that builds the renderer.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
